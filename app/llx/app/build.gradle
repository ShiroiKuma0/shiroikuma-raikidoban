// Versioning — see .claude/skills/build-apk/SKILL.md.
// VERSION_NAME is the semver triplet (e.g. "14.3.0"); BUILD_NUMBER is the per-build "+N" counter,
// i.e. the number THIS build takes. The buildApk task bumps it after each successful build.
def versionTriplet = project.property("VERSION_NAME").toString()
// The counter is ALWAYS present and ALWAYS zero-padded to three digits (+001, +014): no build may
// ever carry a bare version name, or it would re-emit a published APK's name and versionCode. The
// count starts at 1, so a 0 left behind by a publish means "the next build is +001".
def buildNumber = Math.max(1, project.property("BUILD_NUMBER").toString().toInteger())
def forkVersionName = "${versionTriplet}+${String.format('%03d', buildNumber)}"
// versionCode for the 14.3 line: base 3300000 (LightningLauncher's legacy code 330 for 14.3, *10000)
// + patch*10000 + the build counter. e.g. 14.3.0+001 -> 3300001, 14.3.1+001 -> 3310001. The bare
// patch code (3310000) belongs to no build, which is what keeps every APK's code unique.
// If major.minor ever moves off 14.3, update the 3300000 base.
def forkVersionCode = 3300000 + (versionTriplet.tokenize('.')[2].toInteger() * 10000) + buildNumber

def renameApkOutput(variant, forkVersionName) {
    variant.outputs.all { output ->
        output.outputFileName = "shiroikuma-raikidoban_${forkVersionName}_arm64-v8a.apk"
    }
}

// --- Release signing -----------------------------------------------------------------------------
// The key data lives in a GITIGNORED `signing.properties` beside gradle.properties (sp.storeFile /
// sp.keyAlias / sp.storePassword / sp.keyPassword); pass -Psigning.properties=<path> to override.
// The keystore is ~/.android-keystores/shiroikuma-raikidoban.jks, backed up in the 暗号 vault along
// with its password.
//
// Until 2026-09-04 this block was guarded on the `signing.properties` PROPERTY existing, and that
// property was set nowhere in the repo. So the block never ran, Gradle silently fell back to the
// Android debug key, and the build still reported success and wrote a file named exactly like a
// release — indistinguishable from a real one by every check except `apksigner`. 14.3.7+002 was
// published and installed that way. A guard that degrades silently is worse than no guard at all,
// because it buys the reviewer's confidence, so that fallback is now a hard failure (below).
def signingPropsFile = project.hasProperty("signing.properties")
        ? new File(project.property("signing.properties").toString())
        : rootProject.file("signing.properties")
def signingConfigured = signingPropsFile.exists()

if (signingConfigured) {
    Properties props = new Properties()
    signingPropsFile.withInputStream { props.load(it) }

    android {
        signingConfigs {
            release {
                storeFile file(props['sp.storeFile'])
                keyAlias props['sp.keyAlias']
                storePassword props['sp.storePassword']
                keyPassword props['sp.keyPassword']
            }
        }

        // `buildApk` ships the `debug` build type, so it must carry the real key too — otherwise the
        // one artefact 白い熊 actually installs is the one still signed with the debug certificate.
        buildTypes {
            debug {
                signingConfig signingConfigs.release
            }
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

// No key, no APK. Scoped to the task graph rather than thrown at configuration time, so `clean`,
// `tasks` and the like still work on a machine without the key.
gradle.taskGraph.whenReady { graph ->
    if (!signingConfigured && graph.allTasks.any { it.name ==~ /^(assemble|bundle|buildApk).*/ }) {
        throw new GradleException(
                "No signing key: ${signingPropsFile} is missing.\n" +
                "Refusing to build an APK, because Gradle would fall back to the Android debug key " +
                "and emit something named like a release. Create that file with sp.storeFile / " +
                "sp.keyAlias / sp.storePassword / sp.keyPassword (keystore: " +
                "~/.android-keystores/shiroikuma-raikidoban.jks; password in the 暗号 vault's " +
                "android-keystores.org).")
    }
}

android {
    compileSdk 33

    defaultConfig {
        versionCode forkVersionCode
        versionName forkVersionName
        buildConfigField "boolean", "IS_BETA", "false" //  change in core too
        buildConfigField "boolean", "HAS_UEC", "false"

        minSdk 26
        targetSdk 33

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

//    dexOptions {
//        incremental true
//    }

    buildTypes {
        debug {
            // Ship a NON-debuggable APK. Android 15+ pops an "Android App Compatibility" dialog on
            // first launch of a debuggable app ("this is a debuggable app which is currently being
            // tested"); 白い熊 does not want that on his phones. Build with -PdebuggableApk when
            // `adb shell run-as shiroikuma.raikidoban` is needed to inspect app data.
            debuggable project.hasProperty("debuggableApk")
            manifestPlaceholders += [provider_authority: "net.pierrox.lightning_launcher"]
        }
        release {
            manifestPlaceholders += [provider_authority: "net.pierrox.lightning_launcher_extreme"]

            minifyEnabled true
            proguardFiles 'proguard.cfg'

            applicationVariants.all { variant ->
                renameApkOutput(variant, forkVersionName)
            }
        }
    }

    flavorDimensions "version"

    productFlavors {
        extreme {
            manifestPlaceholders += [app_name: "LLAppExtreme"]
            applicationId "shiroikuma.raikidoban"
            dimension "version"
        }
    }
    buildFeatures {
        aidl true
    }
    namespace 'net.pierrox.lightning_launcher_extreme'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

