    implementation libs.androidx.documentfile
}

// Build the (debug-signed) APK, copy it to ~/tmp under the release filename, and bump BUILD_NUMBER.
// See .claude/skills/build-apk/SKILL.md.
tasks.register("buildApk") {
    description = "Assemble the debug APK, copy it to ~/tmp, and auto-increment BUILD_NUMBER"
    dependsOn("assembleExtremeDebug")
    doLast {
        def apkName = "shiroikuma-raikidoban_${forkVersionName}_arm64-v8a.apk"
        def outputDir = layout.buildDirectory.dir("outputs/apk/extreme/debug").get().asFile
        def apk = outputDir.listFiles()?.find { it.name.endsWith(".apk") }
        if (apk != null) {
            def targetDir = new File(System.getProperty("user.home"), "tmp")
            targetDir.mkdirs()
            def targetFile = new File(targetDir, apkName)
            targetFile.bytes = apk.bytes
            println("[1;36m>>> ~/tmp/${apkName}[0m")
        } else {
            throw new GradleException("No APK found in ${outputDir}")
        }

        // Auto-increment BUILD_NUMBER for the next build (consumed only on success).
        def propsFile = rootProject.file("gradle.properties")
        def current = project.property("BUILD_NUMBER").toString().toInteger()
        def next = current + 1
        propsFile.text = propsFile.text.replace("BUILD_NUMBER=${current}", "BUILD_NUMBER=${next}")
        println("[1;36m>>> BUILD_NUMBER bumped to ${next}[0m")
    }
}
