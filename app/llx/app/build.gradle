// Build the release-signed APK, copy it to ~/tmp under the release filename, and bump BUILD_NUMBER.
// See .claude/skills/build-apk/SKILL.md.
tasks.register("buildApk") {
    description = "Assemble the APK, verify its signer, copy it to ~/tmp, and auto-increment BUILD_NUMBER"
    dependsOn("assembleExtremeDebug")
    doLast {
        def apkName = "shiroikuma-raikidoban_${forkVersionName}_arm64-v8a.apk"
        def outputDir = layout.buildDirectory.dir("outputs/apk/extreme/debug").get().asFile
        def apk = outputDir.listFiles()?.find { it.name.endsWith(".apk") }
        if (apk != null) {
            def targetDir = new File(System.getProperty("user.home"), "tmp")
            targetDir.mkdirs()
            def targetFile = new File(targetDir, apkName)
            targetFile.bytes = apk.bytes

            // Prove what we just wrote is not debug-signed. This is precisely the check
            // whose absence let 14.3.7+002 ship under the Android debug key: the build
            // succeeded, the file was named like a release, and only apksigner could tell
            // the difference.
            def apksigner = new File(android.sdkDirectory,
                    "build-tools/${android.buildToolsVersion}/apksigner")
            if (!apksigner.canExecute()) {
                throw new GradleException("Cannot verify the signer: ${apksigner} is not executable.")
            }
            def proc = [apksigner.absolutePath, "verify", "--print-certs",
                        targetFile.absolutePath].execute()
            def certs = proc.text
            proc.waitFor()
            if (proc.exitValue() != 0) {
                throw new GradleException("apksigner rejected ${apkName}:\n${certs}")
            }
            if (certs.contains("CN=Android Debug")) {
                throw new GradleException(
                        "${apkName} is signed with the ANDROID DEBUG KEY - refusing to ship it.\n"
                        + certs)
            }
            println("[1;36m>>> ~/tmp/${apkName}[0m")
            println("[1;32m>>> signer: "
                    + certs.readLines().find { it.contains("certificate DN") } + "[0m")
        } else {
            throw new GradleException("No APK found in ${outputDir}")
        }

        // Auto-increment BUILD_NUMBER for the next build (consumed only on success). The bump is
        // computed from the number this build actually used, so the one just shipped is never reused.
        def propsFile = rootProject.file("gradle.properties")
        def current = project.property("BUILD_NUMBER").toString().toInteger()
        def next = buildNumber + 1
        propsFile.text = propsFile.text.replace("BUILD_NUMBER=${current}", "BUILD_NUMBER=${next}")
        println("[1;36m>>> BUILD_NUMBER bumped to ${next}[0m")
    }
}
